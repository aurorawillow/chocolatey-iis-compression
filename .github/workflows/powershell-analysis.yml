name: "PowerShell Analysis"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.ps1'
      - '.github/workflows/powershell-analysis.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.ps1'
      - '.github/workflows/powershell-analysis.yml'
  schedule:
    - cron: '30 1 * * 0'  # Run at 01:30 UTC every Sunday

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: |
        # Define rules to report but not fail on
        $warningRules = @(
          'PSAvoidTrailingWhitespace',
          'PSAvoidUsingWriteHost'
        )
        
        # Run analysis
        $allResults = Invoke-ScriptAnalyzer -Path . -Recurse
        
        # Display all issues as warnings in GitHub Actions
        $allResults | ForEach-Object {
          Write-Output "::warning file=$($_.ScriptPath),line=$($_.Line),col=$($_.Column)::$($_.RuleName) - $($_.Message)"
        }
        
        # Only fail on issues that aren't in the warning rules list
        $severeIssues = $allResults | Where-Object { $warningRules -notcontains $_.RuleName }
        if ($severeIssues) {
          Write-Error "PSScriptAnalyzer found severe issues that need to be fixed."
          $severeIssues | Format-Table -AutoSize
          exit 1
        }