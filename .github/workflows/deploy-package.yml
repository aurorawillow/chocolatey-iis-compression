name: Deploy Package
on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    if: github.event.pull_request.merged == true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Chocolatey
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))

    - name: Add API Key
      run: choco apikey add --source "https://chocolatey.org/" --key "${{ secrets.CHOCO_API_KEY }}"

    - name: Pack and Push Package
      run: |
        choco pack
        choco push iis-compression.nupkg --source "https://push.chocolatey.org/"