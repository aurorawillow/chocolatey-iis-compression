name: Deploy Package
on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    if: github.event.pull_request.merged == true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Chocolatey packages
      uses: actions/cache@v3
      with:
        path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey
        key: ${{ runner.os }}-chocolatey-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-chocolatey-

    - name: Install Chocolatey
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))

    - name: Add API Key
      run: choco apikey add --source "https://chocolatey.org/" --key "${{ secrets.CHOCO_API_KEY }}"

    - name: Pack Package
      run: choco pack

    - name: Test Package Installation
      run: |
        choco install iis-compression -y -s .
        if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iisbrotli.dll")) {
          throw "Installation failed: iisbrotli.dll not found"
        }
        if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iiszlib.dll")) {
          throw "Installation failed: iiszlib.dll not found"
        }

    - name: Push Package
      if: success()
      run: choco push iis-compression.nupkg --source "https://push.chocolatey.org/"