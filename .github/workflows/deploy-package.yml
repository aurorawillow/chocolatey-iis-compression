name: Deploy Package
on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - '**/*.nuspec'
      - '**/*.ps1'
      - '.github/workflows/deploy-package.yml'

jobs:
  deploy:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Chocolatey
      run: |
        try {
          Set-ExecutionPolicy Bypass -Scope Process -Force
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          Write-Host "Chocolatey installed successfully"
        }
        catch {
          Write-Error "Failed to install Chocolatey: $_"
          exit 1
        }

    - name: Verify Nuspec Version
      run: |
        try {
          [xml]$nuspec = Get-Content -Path "iis-compression.nuspec"
          $version = $nuspec.package.metadata.version.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The <version> element in iis-compression.nuspec is missing or empty. Please update the version before merging."
          }
          Write-Host "Deploying version: $version"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Environment variable set successfully"
        }
        catch {
          Write-Error "Failed to read nuspec version: $_"
          exit 1
        }

    - name: Add API Key
      run: |
        try {
          choco apikey add --source "https://chocolatey.org/" --key "${{ secrets.CHOCO_API_KEY }}"
          Write-Host "API key added successfully"
        }
        catch {
          Write-Error "Failed to add Chocolatey API key: $_"
          exit 1
        }

    - name: Pack Package
      run: |
        try {
          choco pack
          Write-Host "Package packed successfully"
        }
        catch {
          Write-Error "Failed to pack package: $_"
          exit 1
        }

    - name: Test Package Installation
      run: |
        try {
          choco install iis-compression -y -s .
          if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iisbrotli.dll")) {
            throw "Installation failed: iisbrotli.dll not found"
          }
          if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iiszlib.dll")) {
            throw "Installation failed: iiszlib.dll not found"
          }
          Write-Host "Package installation test completed successfully"
        }
        catch {
          Write-Error "Package installation test failed: $_"
          exit 1
        }

    - name: Push Package
      if: success()
      env:
        PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
      run: |
        try {
          $packageFile = "iis-compression.$env:PACKAGE_VERSION.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Package file not found: $packageFile"
          }
          choco push $packageFile --source "https://push.chocolatey.org/"
          Write-Host "Successfully pushed version $env:PACKAGE_VERSION to Chocolatey"
        }
        catch {
          Write-Error "Failed to push package to Chocolatey: $_"
          exit 1
        }

    - name: Create Release
      if: success()
      env:
        PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
      uses: softprops/action-gh-release@v2
      with:
        name: "v${{ env.PACKAGE_VERSION }}"
        tag_name: "v${{ env.PACKAGE_VERSION }}"
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}