name: Check Version Updates
on:
  schedule:
    - cron: '0 0 1 * *'  # Run on the 1st of every month
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-updates:
    runs-on: windows-latest
    env:
      PACKAGE_UPDATED: 'false'
    outputs:
      package_version: ${{ steps.update-script.outputs.version }} # utilize the output from the update-script step
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run update package script
      id: update-script
      run: |
        try {
          $result = ./update-package.ps1
          if ($LASTEXITCODE -eq 0 -and $result -eq $true) {
            echo "PACKAGE_UPDATED=true" >> $env:GITHUB_ENV
            echo "version=$env:nuspec_version" >> $env:GITHUB_OUTPUT
          }
        }
        catch {
          Write-Error "Failed to run update script: $_"
          exit 1
        }
      working-directory: .github\workflows
      
    - name: Update Nuspec Version
      if: env.PACKAGE_UPDATED == 'true'
      run: |
        try {
          [xml]$nuspec = Get-Content -Path "iis-compression.nuspec"
          $version = $env:nuspec_version
          $nuspec.package.metadata.version = $version
          $nuspec.Save("iis-compression.nuspec")
          Write-Host "Successfully updated nuspec version to $version"
        }
        catch {
          Write-Error "Failed to update nuspec version: $_"
          exit 1
        }
      
    - name: Run validation checks
      if: env.PACKAGE_UPDATED == 'true'
      env:
        x86_sha256: ${{ env.x86_sha256 }}
        amd64_sha256: ${{ env.amd64_sha256 }}
        nuspec_version: ${{ steps.update-script.outputs.version }}
      run: |
        try {
          ./run-validation-checks.ps1
        }
        catch {
          Write-Error "Validation checks failed: $_"
          exit 1
        }
      working-directory: .github\workflows

    - name: Test package installation
      if: env.PACKAGE_UPDATED == 'true'
      run: |
        try {
          choco pack
          choco install iis-compression -y -s .
          if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iisbrotli.dll")) {
            throw "Installation failed: iisbrotli.dll not found"
          }
          if (-not (Test-Path "$env:ProgramFiles\IIS\IIS Compression\iiszlib.dll")) {
            throw "Installation failed: iiszlib.dll not found"
          }
          Write-Host "Package installation test completed successfully"
        }
        catch {
          Write-Error "Package installation test failed: $_"
          exit 1
        }
      
    - name: Create Pull Request
      if: env.PACKAGE_UPDATED == 'true' && success()
      uses: peter-evans/create-pull-request@v7
      with:
        title: "Update IIS Compression Package to ${{ steps.update-script.outputs.version }}"
        body: |
          Automated package update via GitHub Actions
          - Updated to version ${{ steps.update-script.outputs.version }}
          - Updated version in nuspec file
          - Validated MSI files and checksums
          - Updated URLs and checksums in install script
          - Tested package installation
        branch: "feature/update-package-${{ github.run_number }}"
        commit-message: "Update package to version ${{ steps.update-script.outputs.version }}"
        delete-branch: true